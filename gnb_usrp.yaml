# ==============================================================================
# srsRAN Project gNB — USRP B205 mini-i (Hardware Mode)
# ==============================================================================
# Berdasarkan: config yang terbukti running dari kelompok sebelah
#
# Topology:
#   RAN  (gNB)  : 10.91.2.1
#   RIC  (E2AP) : 10.91.2.2
#   Core (AMF)  : 10.91.2.4
# ==============================================================================

cu_cp:
  amf:
    addr: 10.91.2.4                 # IP node Core (AMF)
    bind_addr: 10.91.2.1            # IP node RAN (gNB)
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: uhd
  device_args: type=b200,num_recv_frames=64,num_send_frames=64
  srate: 23.04
  otw_format: sc12
  tx_gain: 80
  rx_gain: 40

cell_cfg:
  dl_arfcn: 368500                  # ARFCN of the downlink carrier (center frequency).
  band: 3                           # The NR band.
  channel_bandwidth_MHz: 10         # Bandwith in MHz. Number of PRBs will be automatically derived.
  common_scs: 15                    # Subcarrier spacing in kHz used for data.
  plmn: "00101"                     # PLMN broadcasted by the gNB.
  tac: 7                            # Tracking area code (needs to match the core configuration).
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

# --- E2 Interface ke Near-RT RIC ---
e2:
  enable_du_e2: false
  addr: 10.91.2.2                   # IP node RIC (E2AP endpoint)
  port: 36421
  bind_addr: 10.91.2.1              # IP node RAN (bind address)
  e2sm_kpm_enabled: false
  e2sm_rc_enabled: false

log:
  filename: /home/telmat/TA-Rizqi-Nabiel/O-RAN-Testbed-Automation/Next_Generation_Node_B/logs/gnb.log
  all_level: info
  hex_max_size: 0

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: true
  ngap_filename: /tmp/gnb_ngap.pcap
