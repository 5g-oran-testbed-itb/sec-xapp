SM_DIR = "/usr/local/lib/flexric/"

# supported name = NearRT_RIC, E2_Agent, E2_Proxy_Agent, xApp
Name = "xApp"
NearRT_RIC_IP = "10.91.2.2"
E42_Port = 36422

# supported name : KPM, RC
# supported time (ms): 1, 2, 5, 10, 100, 1000, Note: no need timer for RC Report Service , set as 0
# supported KPM action definition format: 1, 4
# supported RC  action definition format: 1
# supported ran_type: ngran_gNB, ngran_gNB_CU, ngran_gNB_DU
Sub_ORAN_SM_List = (
    # Format 1: Cell-level monitoring — ALWAYS fires even when UE is idle.
    # Feeds cell-level rule-based + LSTM IDS for baseline anomaly detection.
    { name = "KPM", time = 1000,
      format = 1,
      ran_type = "ngran_gNB_DU",
      actions = (
            { name = "RRU.PrbUsedDl" },
            { name = "RRU.PrbUsedUl" },
            { name = "RRU.PrbAvailDl" },
            { name = "RRU.PrbAvailUl" },
            { name = "DRB.AirIfDelayUl" },
            { name = "RACH.PreambleDedCell" },
            { name = "DRB.RlcSduTransmittedVolumeUL" },
            { name = "DRB.RlcSduTransmittedVolumeDL" },
            { name = "DRB.RlcPacketDropRateDl" },
            { name = "DRB.RlcDelayUl" }
            )
    },
    # Format 4: Per-UE monitoring — fires AUTOMATICALLY when UE has active traffic.
    # During an attack the UE generates traffic, triggering this within 1 report period (1s).
    # This identifies WHICH UE (RNTI) is attacking so mitigation can target it.
    { name = "KPM", time = 1000,
      format = 4,
      ran_type = "ngran_gNB_DU",
      actions = (
            { name = "DRB.UEThpDl" },
            { name = "DRB.UEThpUl" },
            { name = "RRU.PrbUsedDl" },
            { name = "RRU.PrbUsedUl" },
            { name = "DRB.RlcSduTransmittedVolumeUL" },
            { name = "DRB.RlcSduTransmittedVolumeDL" },
            { name = "DRB.RlcPacketDropRateDl" },
            { name = "DRB.RlcDelayUl" }
            )
    }
)

xApp_DB = {
    enable = "OFF"
    ip = "127.0.0.1"
    dir = "/tmp/"
    filename = "testdb"
    username = "xapp" # if using mysql
    password = "eurecom" # if using mysql
}
