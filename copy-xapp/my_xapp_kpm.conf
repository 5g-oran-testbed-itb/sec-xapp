# supported name : KPM, RC
# supported time (ms): 1, 2, 5, 10, 100, 1000, Note: no need timer for RC Report Service , set as 0
# supported KPM action definition format: 1, 4
# supported RC  action definition format: 1
# supported ran_type: ngran_gNB, ngran_gNB_CU, ngran_gNB_DU
Sub_ORAN_SM_List = (
    { name = "KPM", time = 10,
      format = 1,
      ran_type = "ngran_gNB_DU",
      actions = (
            { name = "DRB.UEThpDl" },
            { name = "DRB.UEThpUl" },
            { name = "RRU.PrbUsedDl" },
            { name = "RRU.PrbUsedUl" },
            { name = "RRU.PrbAvailDl" },
            { name = "RRU.PrbAvailUl" },
            { name = "DRB.AirIfDelayUl" },
            { name = "RACH.PreambleDedCell" },
            { name = "DRB.RlcSduTransmittedVolumeUL" },
            { name = "DRB.RlcSduTransmittedVolumeDL" },
            { name = "DRB.RlcPacketDropRateDl" },
            { name = "DRB.RlcDelayUl" },
            { name = "CQI" },
            { name = "RSRP" },
            { name = "RSRQ" }
            )
    }
)

xApp_DB = {
    enable = "OFF"
    ip = "127.0.0.1"
    dir = "/tmp/"
    filename = "testdb"
    username = "xapp" # if using mysql
    password = "eurecom" # if using mysql
